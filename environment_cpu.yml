name: af3
channels:
  - pytorch
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pytorch::pytorch
  - torchvision
  # plotting + notebooks
  - matplotlib
  - ipykernel
  - nbformat
  - nbconvert
  - py3dmol
  # chemistry / structure I/O
  - rdkit
  - biopython
  - biotite>=1.3,<1.5
  - modelcif
  - gemmi
  - pdbeccdutils
  # numerics
  - scipy
  - pandas
  - scikit-learn
  - numpy>=2
  - networkx
  # config / utilities
  - ml-collections
  - pyyaml
  - tqdm
  - ipywidgets
  - icecream
  - ipdb
  # direct runtime imports (do not rely on transitive deps)
  - optree
  - requests
  - packaging
  - typing_extensions
  # optional fast paths (uncomment if you use .lmdb inputs / want faster JSON):
  #   - lmdb     # only needed for .lmdb feature caches
  #   - orjson   # JSON fast-path; code falls back to stdlib json if absent
  - pip:
    - fair-esm==2.0.0
